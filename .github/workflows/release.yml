name: Release

# Publie une release GitHub avec les paquets macOS et Linux à chaque tag vX.Y.Z.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pool Manager ${{ github.ref_name }}
          releaseBody: |
            Paquets macOS (Apple Silicon et Intel) et Linux (.deb, .AppImage).
            Nécessite un serveur Pool Manager joignable — voir le README.

            macOS : l'app n'est pas signée. Au premier lancement, clic droit → Ouvrir,
            ou `xattr -dr com.apple.quarantine "/Applications/Pool Manager.app"`.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
