[package]
name = "pool-manager"
version = "0.3.0"
description = "Pool Manager — tableaux et chronologie"
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire (problème Windows/cargo#8519).
name = "pool_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
